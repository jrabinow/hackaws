plugins {
    id 'java'
    id 'application'
}

group = 'com.hackathon'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Add your dependencies here
    implementation 'org.springframework.boot:spring-boot-starter:3.1.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'com.baeldung.jdi.JDIExampleDebugger'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.baeldung.jdi.JDIExampleDebugger'
        )
    }
}
