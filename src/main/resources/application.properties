# Server configuration
server.port=8080
spring.application.name=debug-mcp-server

# MCP Server configuration
mcp.server.name="Debug MCP Server"
mcp.server.version=1.0.0

# MCP Endpoints 
# This configures the path where the MCP server will be exposed
mcp.server.servlet-path=/mcp

# Logging configuration
logging.level.root=INFO
logging.level.com.example.gosling=DEBUG
logging.level.io.modelcontextprotocol=INFO

# Simple MCP properties
mcp.debug.simulation.enabled=true
mcp.debug.variables.preload=true
